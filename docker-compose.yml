name: postgres-kafka-cdc

services:
  # Source database: the system of record whose changes we capture.
  source-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
      # Used by init/02-debezium.sh to create Debezium's least-privilege role.
      DEBEZIUM_POSTGRES_USER: ${DEBEZIUM_POSTGRES_USER}
      DEBEZIUM_POSTGRES_PASSWORD: ${DEBEZIUM_POSTGRES_PASSWORD}
    # wal_level=logical makes the WAL decodable into row-level changes,
    # which is what Debezium's logical replication slot reads.
    command: ["postgres", "-c", "wal_level=logical"]
    ports:
      - "5433:5432"
    volumes:
      - source-db-data:/var/lib/postgresql/data
      # SQL files here run once, on first initialization of an empty data volume.
      - ./db/source/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Destination database: the consumer applies captured changes here.
  # Plain Postgres; nothing reads its WAL, so default wal_level is fine.
  dest-db:
    image: postgres:17
    environment:
      POSTGRES_USER: ${DEST_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DEST_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DEST_POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - dest-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Single Kafka node in KRaft mode (acts as both broker and controller; no ZooKeeper).
  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Fixed cluster ID so the data volume stays valid across restarts (not a secret).
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # INTERNAL: other containers (kafka:9092). EXTERNAL: tools on the host (localhost:29092).
      # CONTROLLER: KRaft metadata traffic, never exposed.
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # One broker means internal topics can only have one replica.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "29092:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server kafka:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 15s

  # Kafka Connect runtime with the Debezium connector plugins pre-installed.
  # Stateless: connector configs, source offsets (WAL positions) and statuses
  # are stored in the three Kafka topics below.
  connect:
    image: quay.io/debezium/connect:3.7.1.Final
    depends_on:
      kafka:
        condition: service_healthy
      source-db:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: cdc-connect
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      # One broker, so Connect's internal topics can only have one replica.
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
      # Config provider: lets connector JSON reference ${env:NAME} placeholders,
      # resolved from this container's environment when the connector starts.
      # Keeps the Debezium password out of the connector config and the REST API.
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      DEBEZIUM_POSTGRES_USER: ${DEBEZIUM_POSTGRES_USER}
      DEBEZIUM_POSTGRES_PASSWORD: ${DEBEZIUM_POSTGRES_PASSWORD}
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8083/ > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

  # Optional web UI for browsing topics, messages, consumer groups and connectors.
  # Only starts with: docker compose --profile tools up -d
  # Read-only: it observes the pipeline but cannot produce, delete or reset anything.
  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.5.0
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "true"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: debezium
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "8080:8080"

volumes:
  source-db-data:
  dest-db-data:
  kafka-data:
